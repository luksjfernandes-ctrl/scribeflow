# Mantém o projeto Supabase acordado.
#
# O plano free do Supabase pausa um projeto após ~7 dias sem nenhuma
# requisição, e NÃO existe configuração do lado deles para desligar isso.
# A única forma de evitar a pausa é bater na API periodicamente — é o que
# este workflow faz, a cada 3 dias (metade da janela, com folga para uma
# execução falhar sem consequência).
#
# A anon key abaixo é pública por design: ela vai embutida no bundle de
# qualquer app Supabase e a proteção real é a RLS (ver supabase_schema.sql,
# que habilita RLS nas duas tabelas). Por isso ela fica inline, e não em
# secrets — assim o workflow funciona sem nenhuma configuração manual.
#
# LIMITAÇÃO CONHECIDA: o GitHub desabilita workflows agendados em repos sem
# commits por 60 dias, e avisa por e-mail antes. Se isso acontecer, basta
# reabilitar em Actions ou rodar o "Run workflow" manualmente.

name: keep-alive supabase

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a API do Supabase
        run: |
          URL="https://hfedfobmhcphlcmxhulm.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZWRmb2JtaGNwaGxjbXhodWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI1NDIxMzMsImV4cCI6MjA5ODExODEzM30.xQoeC0XWubVJueXJ9LdTf-hBmKHVxiMMybG6_giFJoc"
          # Consulta que realmente toca o Postgres (RLS devolve [] para anônimo;
          # o que importa é o 200, que conta como atividade no projeto).
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive falhou com HTTP $code — o projeto pode estar pausado."
            exit 1
          fi
